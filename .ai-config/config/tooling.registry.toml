# Tooling contract registry.
# Human use: read this file to see which tool owns which mechanical check.
# AI/CI use: .ai-config/tools/check_rule_tool_contracts.py verifies these contracts.

[metadata]
version = 1
owner_rule = ".ai-config/AGENTS.md"
# 住在 .ai-config/ 而不是 docs/:工具层的文档归工具层自己的命名空间,接管脚本刻意不写项目的 docs/,
# 放在 docs/ 就会变成"受管清单里断言了一个接管时根本不会落地的路径"。
human_doc = ".ai-config/TOOLING_CONTRACTS.md"
checker = ".ai-config/tools/check_rule_tool_contracts.py"
# 两个入口是两件事,别合并:
#   unified_entrypoint —— 命令的实现在哪(检查器读它的正文,确认每个 tool id 都被分发)。
#   launch_entrypoint  —— pre-commit / CI 该喊谁。它只负责挑 Python 环境,再转给上面那个。
# 合成一个就等于假设"闸的实现文件本身跑得起来",而接管态的纯 TS/Go 仓根本没有能 import
# pydantic 的环境——正是那个假设让接管后每次 commit 都被拦下。
unified_entrypoint = "tools/check.py"
launch_entrypoint = "tools/gate.py"
changed_event_kinds = ["python", "source", "ruff_python", "code", "contract", "backend_contract", "test"]

[metadata.capability_cli_owners]
basedpyright = "basedpyright"
deptry = "deptry"
detect-secrets-hook = "detect-secrets"  # pragma: allowlist secret  (CLI 名不是密钥;Secret Keyword 检测器对 key 含 "secret" 的赋值假阳)
lint-imports = "import-linter"
pip-audit = "pip-audit"
pytest = "pytest"
radon = "radon"
ruff = "ruff-check"
semgrep = "semgrep"

[[tools]]
id = "python-compile"
languages = ["python"]  # 只对 Python 有效;未声明 python 的项目会显式跳过而不是静默通过
capability_id = "syntax-compile"
kind = "python-stdlib"
purpose = "Fast syntax/importability-adjacent smoke check by byte-compiling code_layout code dirs."
rule = ".ai-config/AGENTS.md"
configured_in = [".ai-config/project_model.toml", "tools/check.py", "tools/tooling_layout.py"]
pre_commit_hook = "python-compile"
entrypoint_commands = ["uv run python -m compileall -q {all_code_paths}"]
changed_when = ["python"]
stages = ["quick", "ci", "cleanup"]
scope = "Python files under code_layout.fixed_quality_dirs + support_dirs."
boundary = "Only catches syntax and bytecode compilation failures; it does not replace tests, typing, or runtime checks."

[[tools]]
id = "pre-commit-basic-hooks"
fixture_exempt = true
fixture_exempt_reason = "第三方 hygiene 捆绑,只经 pre-commit 执行,check.py 里没有对应 item 可单独调用。"
kind = "pre-commit-hook-bundle"
purpose = "Repository hygiene checks from pre-commit-hooks: large files, JSON/YAML/TOML syntax, EOF newline, and trailing whitespace."
rule = ".ai-config/AGENTS.md"
configured_in = [".pre-commit-config.yaml"]
pre_commit_hooks = [
    "check-added-large-files",
    "check-json",
    "check-yaml",
    "check-toml",
    "end-of-file-fixer",
    "trailing-whitespace",
]
scope = "Generic repository hygiene checks maintained by the external pre-commit-hooks package."
boundary = "Mechanical file hygiene only; ownership stays in pre-commit config, not project semantics."

[[tools]]
id = "rule-tool-contracts"
capability_id = "tooling-contracts"
kind = "project-static-tool"
purpose = "Validate AI rules, tool registry, static rules, CI, and pre-commit wiring contracts."
rule = ".ai-config/AGENTS.md"
configured_in = [".ai-config/tools/check_rule_tool_contracts.py", ".ai-config/tools/rule_tool_registry_contracts.py", ".ai-config/config/tooling.registry.toml", ".ai-config/project_model.toml", ".gitignore", "tools/check.py", "tools/check_changed.py", "tools/project_model.py", "tools/tooling_layout.py", "tools/tooling_registry.py", "tools/inventory.py", "tools/evidence_extractors.py", "tools/project_discovery.py", "tools/project_bootstrap.py", "tools/stage_packet.py", "tools/subagent_review_packet.py"]
pre_commit_hook = "rule-tool-contracts"
entrypoint_commands = ["uv run python .ai-config/tools/check_rule_tool_contracts.py"]
changed_when = ["python", "source", "contract"]
stages = ["quick", "ci", "cleanup"]
scope = "AI rule files, tool registry, .gitignore artifact hygiene, Semgrep rulesets, CI, pre-commit trigger regex, and deleted-rule stale references."
boundary = "Mechanical contract validation only; it does not decide whether a rule or tool policy is desirable."

[[tools]]
id = "project-bootstrap"
capability_id = "project-bootstrap"
kind = "project-static-tool"
purpose = "Bootstrap project adoption: build an evidence-only file/reference map before normal stage and cleanup gates."
rule = ".ai-config/AGENTS.md"
configured_in = [".ai-config/project_model.toml", "tools/project_model.py", "tools/inventory.py", "tools/evidence_extractors.py", "tools/project_bootstrap.py", ".ai-config/config/tooling.registry.toml"]
entrypoint_commands = ["uv run python tools/project_bootstrap.py build"]
stages = ["bootstrap"]
scope = "Repository files after project_model.ignore pruning; extracts generic file reference edges from small text/code files."
boundary = "Evidence packet only: it proposes project_model calibration inputs but never approves identity or blocks changes."

[[tools]]
id = "inventory-closure"
capability_id = "inventory-closure"
kind = "project-static-tool"
purpose = "Full cleanup/CI inventory closure: block parse errors, unclassified Python files, and declared-zone import-policy violations."
rule = ".ai-config/AGENTS.md"
configured_in = [".ai-config/project_model.toml", "tools/project_model.py", "tools/inventory.py", ".ai-config/config/tooling.registry.toml"]
entrypoint_commands = ["uv run python tools/inventory.py check"]
stages = ["ci"]
scope = "All Python files matched by project_model.python.include_globs, excluding project_model.ignore.patterns."
boundary = "Declared-model mechanical inventory only; every non-ignored Python file must have a zone. It does not decide whether a declared zone is semantically appropriate."

[[tools]]
id = "inventory-closure-changed"
capability_id = "inventory-closure"
kind = "project-static-tool"
stage_gate = "identity"
enforcement = "blocking"
changed_adapter = true
parent_tool = "inventory-closure"
cleanup_replacement = "model-health"
purpose = "Changed-file inventory closure for stage: block changed Python files with no zone, changed modeled code importing unmodeled Python, and changed import-policy violations."
rule = ".ai-config/AGENTS.md"
configured_in = [".ai-config/project_model.toml", "tools/project_model.py", "tools/inventory.py", ".ai-config/config/tooling.registry.toml"]
entrypoint_commands = ["uv run python tools/inventory.py check --scope changed"]
changed_when = ["python"]
stages = ["quick", "stage"]
scope = "Changed, staged, and untracked Python files matched by project_model.python.include_globs."
boundary = "Fast stage closure only; full import drift remains in cleanup model-health; orphan-tool hints belong to cleanup discovery evidence."

[[tools]]
id = "model-health"
capability_id = "inventory-closure"
kind = "project-static-tool"
purpose = "Full cleanup owner for inventory closure and project_model health: block closure violations, then audit required review metadata and trait-based zone pressure."
rule = ".ai-config/AGENTS.md"
configured_in = [".ai-config/project_model.toml", "tools/project_model.py", "tools/inventory.py"]
entrypoint_commands = ["uv run python tools/inventory.py health"]
stages = ["cleanup"]
scope = "Full Python inventory plus project_model zone metadata."
boundary = "Runs the same mechanical closure as inventory-closure before metadata health; it does not decide whether a zone is architecturally acceptable."

[[tools]]
id = "project-discovery-changed"
capability_id = "project-discovery"
kind = "project-static-tool"
stage_gate = "review-material"
enforcement = "material"
changed_adapter = true
parent_tool = "project-discovery"
purpose = "Changed-scope review evidence: surface changed unmodeled structures, import traces, and entrypoint-like hints without turning guesses into blockers."
rule = ".ai-config/AGENTS.md"
configured_in = [".ai-config/project_model.toml", "tools/project_model.py", "tools/inventory.py", "tools/evidence_extractors.py", "tools/project_discovery.py", ".ai-config/config/tooling.registry.toml"]
entrypoint_commands = ["uv run python tools/project_discovery.py check --scope changed"]
changed_when = ["python", "source"]
stages = ["stage"]
scope = "Changed, staged, and untracked Python files plus inventory-derived import evidence."
boundary = "Evidence packet only for heuristic discovery; hard blocking belongs to inventory/model closure and explicit import-policy facts."

[[tools]]
id = "project-discovery"
capability_id = "project-discovery"
kind = "project-static-tool"
purpose = "Full cleanup review evidence: surface unmodeled code islands, embedded projects, orphan check tools, temp-as-weight-bearing, and stale declarations."
rule = ".ai-config/AGENTS.md"
configured_in = [".ai-config/project_model.toml", "tools/project_model.py", "tools/inventory.py", "tools/evidence_extractors.py", "tools/project_discovery.py", ".ai-config/config/tooling.registry.toml"]
entrypoint_commands = ["uv run python tools/project_discovery.py check"]
stages = ["cleanup"]
scope = "Full repository inventory matched by project_model.python.include_globs, excluding project_model.ignore.patterns."
boundary = "Heuristic findings are evidence-only for subagents; only explicit model/fact violations may be critical, and the tool never writes project_model."

[[tools]]
id = "stage-packet"
capability_id = "review-packet"
kind = "project-static-tool"
stage_gate = "review-material"
# 它在"一条 [[risk_rules]] 都没声明"时也会非零退出,但那条判据的正主是 rule-tool-contracts
# (模型完整性契约,已在 pre-commit 自动触发);这里的退出只是使用现场的兜底,不是执法点。
enforcement = "material"
purpose = "Build a structured stage review packet for contract, dependency, entrypoint, public API, delete/rename, and cross-zone risks."
rule = ".ai-config/AGENTS.md"
configured_in = [".ai-config/project_model.toml", "tools/project_model.py", "tools/stage_packet.py", "tools/inventory.py"]
entrypoint_commands = ["uv run python tools/stage_packet.py build"]
stages = ["stage", "cleanup"]
scope = "Changed, staged, and untracked files plus inventory-derived import and public-symbol facts."
boundary = "Material packet only; it reports risk flags but does not approve or reject semantic design choices."

[[tools]]
id = "subagent-review-stage"
capability_id = "subagent-review"
kind = "project-static-tool"
stage_gate = "agent-review"
# 同 stage-packet:0 个 [[agent_reviews]] 的执法点在 rule-tool-contracts,这里只兜底。
enforcement = "material"
purpose = "Generate declared stage subagent review prompts from project_model, inventory, and stage packet."
rule = ".ai-config/AGENTS.md"
configured_in = [".ai-config/project_model.toml", "tools/project_model.py", "tools/subagent_review_packet.py", "tools/tooling_registry.py", "tools/inventory.py", "tools/evidence_extractors.py", "tools/project_bootstrap.py", "tools/project_discovery.py", "tools/stage_packet.py"]
entrypoint_commands = ["uv run python tools/subagent_review_packet.py stage"]
stages = ["stage"]
cleanup_replacement = "subagent-review-cleanup"
scope = "Writes .cache/subagent-reviews/stage prompts; human/Codex uses these to spawn read-only subagents."
boundary = "Creates review packets only; it does not approve, reject, or modify code."

[[tools]]
id = "changed"
capability_id = "changed-dispatch"
kind = "project-static-tool"
purpose = "Automatically run fixed static checks and registered path triggers for changed, staged, and untracked code files."
rule = ".ai-config/AGENTS.md"
configured_in = ["tools/check.py"]
entrypoint_commands = ["uv run python tools/check.py changed"]
stages = ["changed"]
scope = "Changed, staged, and untracked code files; path triggers decide special checks."
boundary = "Uses local git state and may run broader fixed checks such as Semgrep/import-linter. Rule/tooling/pre-commit changes force contract checks; expensive or data-dependent checks stay path-triggered."

[[tools]]
id = "ruff-staged"
languages = ["python"]  # 只对 Python 有效;未声明 python 的项目会显式跳过而不是静默通过
capability_id = "python-lint"
kind = "python-dev-tool"
package = "ruff"
purpose = "Run Ruff on staged Python files without autofix."
rule = ".ai-config/AGENTS.md"
configured_in = [".ruff.toml", ".pre-commit-config.yaml", "tools/check.py"]
pre_commit_hook = "ruff-staged"
entrypoint_commands = ["uv run ruff check --no-fix --force-exclude"]
stages = ["quick"]
scope = "Staged Python files."
boundary = "Changed-file lint only; full lint and formatting are separate checks."

[[tools]]
id = "ruff-check"
languages = ["python"]  # 只对 Python 有效;未声明 python 的项目会显式跳过而不是静默通过
capability_id = "python-lint"
kind = "python-dev-tool"
package = "ruff"
purpose = "Full Ruff lint check."
rule = ".ai-config/AGENTS.md"
configured_in = [".ruff.toml"]
pre_commit_hook = "ruff-check"
entrypoint_commands = ["uv run ruff check ."]
stages = ["cleanup"]
scope = "Repository Python lint scope configured by Ruff."
boundary = "Lint only; formatting is a separate check."
relaxed = true
relaxed_reason = "模板默认把全量 ruff check 放在 cleanup，不默认阻塞普通阶段；旧项目常有 lint backlog。"
reopen_when = "新项目或旧账清零后，把 `ruff-check` 升入 quick/ci。"

[[tools]]
id = "ruff-format-check"
languages = ["python"]  # 只对 Python 有效;未声明 python 的项目会显式跳过而不是静默通过
capability_id = "python-format"
kind = "python-dev-tool"
package = "ruff"
purpose = "Full Ruff formatting check."
rule = ".ai-config/AGENTS.md"
configured_in = [".ruff.toml"]
pre_commit_hook = "ruff-format"
entrypoint_commands = ["uv run ruff format --check ."]
stages = ["cleanup"]
scope = "Repository Python format scope configured by Ruff."
boundary = "Format check only; lint is a separate check."
relaxed = true
relaxed_reason = "模板默认把全量格式检查放在 cleanup，不默认阻塞普通阶段；旧项目常有格式 backlog。"
reopen_when = "新项目或旧账清零后，把 `ruff-format-check` 升入 quick/ci。"

[[tools]]
id = "basedpyright"
languages = ["python"]  # 只对 Python 有效;未声明 python 的项目会显式跳过而不是静默通过
capability_id = "type-check"
kind = "python-dev-tool"
package = "basedpyright"
purpose = "Type, signature, optionality, and static Python type consistency checks."
rule = ".ai-config/AGENTS.md"
# pyrightconfig.json 必须有,而且必须随受管清单发给每个 Python 项目:
# basedpyright 裸跑用的是它最严的 recommended 档,九成以上是"类型未知"族的 strictness 噪音
# (reportAny / reportUnknownMemberType 之类),真 error 淹在里面。一道常年几千条的红灯等于
# 没有红灯。用 standard 档 + 排除 gates。
# 另外 exclude 会整体替换 pyright 的默认排除,所以 **/.* 必须写回来,漏了会去扫 .venv 直到超时。
configured_in = ["pyrightconfig.json"]
pre_commit_hook = "basedpyright"
entrypoint_commands = ["uv run basedpyright"]
stages = ["cleanup"]
scope = "Project-configured Python package scope; keep basedpyright available but non-blocking until the project opts into typed blocking."
boundary = "Does not replace tests, runtime behavior checks, or script/test typing outside the configured scope."
relaxed = true
relaxed_reason = "模板默认把 basedpyright 作为可跑的类型闸，但不默认阻塞提交；不同项目类型覆盖面差异很大。"
reopen_when = "项目明确 Python 包边界且 basedpyright 无残留 error 后，把它加进 ci stage 并去掉 relaxed。"

[[tools]]
id = "import-linter"
languages = ["python"]  # 只对 Python 有效;未声明 python 的项目会显式跳过而不是静默通过
capability_id = "import-architecture"
kind = "python-dev-tool"
package = "import-linter"
stage_gate = "dependency"
enforcement = "blocking"
purpose = "Layered import architecture contracts."
rule = ".ai-config/AGENTS.md"
configured_in = [".importlinter"]
required_paths = [".importlinter"]
trigger_on_configured_in = true
pre_commit_hook = "import-linter"
entrypoint_commands = ["uv run lint-imports --config .importlinter --no-cache"]
changed_when = ["ruff_python"]
stages = ["quick", "stage", "ci", "cleanup"]
boundary = "Checks import direction only; does not prove runtime architecture quality."

[[tools]]
id = "detect-secrets"
capability_id = "secret-scan"
kind = "python-dev-tool"
package = "detect-secrets"
purpose = "Secret leakage scan."
rule = ".ai-config/AGENTS.md"
configured_in = [".pre-commit-config.yaml"]
pre_commit_hook = "detect-secrets"
# detect-secrets-hook(不是 scan)：scan 只吐 baseline JSON、恒退 0；hook 才会在发现密钥时退非 0。
# hook 不递归目录，所以必须用 {scannable_files} 展开成显式文件清单。
# --exclude-files 与 .pre-commit-config.yaml 的 exclude 保持同一集合。
entrypoint_commands = ["uv run detect-secrets-hook --exclude-files '^(uv\\.lock|\\.ai-config/config/settings\\.json|\\.ai-config/template-state\\.json|gates/.*)$' {scannable_files}"]
stages = ["ci", "cleanup"]
boundary = "Does not decide whether a found value is safe to publish; human review is still required."

[[tools]]
id = "semgrep"
capability_id = "security-pattern-scan"
kind = "python-dev-tool"
package = "semgrep"
purpose = "Project static guardrails that are too specific for Ruff."
rule = ".ai-config/AGENTS.md"
configured_in = [".semgrep"]
trigger_on_configured_in = true
pre_commit_hook = "semgrep"
# --error 是必须的：没有它 semgrep 只报告不改退出码(WARNING severity 恒退 0)，闸看着在跑其实拦不住。
entrypoint_commands = ["uv run semgrep --error --disable-version-check --metrics=off --config .semgrep --no-git-ignore {all_code_paths} .ai-config"]
changed_when = ["code"]
stages = ["quick", "ci", "cleanup"]
scope = "code_layout fixed/support dirs plus .ai-config."
boundary = "Use for stable static patterns only; do not encode broad business semantics."

[[tools]]
id = "dependency-change-approval"
capability_id = "dependency-approval"
kind = "project-static-tool"
purpose = "Block staged dependency or lock-file changes until the user has explicitly approved the dependency/toolchain impact."
rule = ".ai-config/AGENTS.md"
configured_in = [".pre-commit-config.yaml", "tools/check.py"]
pre_commit_hook = "dependency-change-approval"
entrypoint_commands = ["uv run python tools/check.py dependency-change-approval"]
stages = ["cleanup"]
scope = "Staged files matching project_model.contracts.dependency_files. Override after discussion with ONCALL_ALLOW_DEPENDENCY_CHANGE=1."
boundary = "Checks that approval was made explicit; it cannot judge whether the dependency decision is good."

[[tools]]
id = "pip-audit"
languages = ["python"]  # 只对 Python 有效;未声明 python 的项目会显式跳过而不是静默通过
fixture_exempt = true
fixture_exempt_reason = "违规存在于依赖世界(需要一个真带 CVE 的依赖),无法用本仓代码样本表达;其有效性由 lock 与漏洞库保证。"
capability_id = "dependency-vulnerability"
kind = "python-dev-tool"
package = "pip-audit"
purpose = "Dependency vulnerability audit."
rule = ".ai-config/AGENTS.md"
configured_in = ["pyproject.toml"]
pre_commit_hook = "pip-audit"
# 定向忽略 3 个 mcp 传递依赖漏洞,而不是把整道安全闸调成 relaxed(那会连新漏洞一起放过)。
# 原因:mcp 被 semgrep 的解析树钉在 1.23.3,直接 --upgrade-package 移不动;修复版 1.27.2/1.28.1
# 拉不进来。清除条件(可判定):`uv lock --upgrade-package mcp` 后 uv.lock 里 mcp >= 1.28.1,
# 即把这三个 --ignore-vuln 删掉重跑 pip-audit 应为绿。登记日期 2026-07-27。
entrypoint_commands = ["uv run pip-audit --skip-editable --ignore-vuln PYSEC-2026-3481 --ignore-vuln PYSEC-2026-3482 --ignore-vuln PYSEC-2026-3483"]
stages = ["ci", "cleanup"]
boundary = "Vulnerability triage still needs human decision for ignore, upgrade, or mitigation."

[[tools]]
id = "pytest"
languages = ["python"]  # 只对 Python 有效;未声明 python 的项目会显式跳过而不是静默通过
fixture_exempt = true
fixture_exempt_reason = "它本身就是测试套件,反向样本会与被测代码循环;测试的有效性由 test-meta 与 CI 红灯保证。"
capability_id = "test-suite"
kind = "python-dev-tool"
package = "pytest"
purpose = "Unit and integration tests."
rule = ".ai-config/AGENTS.md"
configured_in = ["pyproject.toml"]
entrypoint_commands = ["uv run pytest {test_dirs}"]
stages = ["ci", "cleanup"]
scope = "Stable automated tests under tests/. Script-style validation under scripts/ remains manual or changed-file scoped until it is refactored into stable tests."
boundary = "CI runs the stable tests/ suite only; service-dependent or data-preparation scripts must not be implied by the default pytest contract."

[[tools]]
id = "radon"
languages = ["python"]  # 只对 Python 有效;未声明 python 的项目会显式跳过而不是静默通过
capability_id = "code-complexity"
kind = "python-dev-tool"
package = "radon"
purpose = "Maintainability-index advisory scan; CC ownership belongs to the complexity ratchet."
rule = ".ai-config/rules/engineering/code.index.md"
configured_in = ["pyproject.toml"]
entrypoint_commands = ["uv run radon mi {fixed_quality_paths} -s"]
stages = ["deep", "cleanup"]
scope = "Use MI for 80/20 maintainability triage in code_layout.fixed_quality_dirs; CC≥21 is collected once by `complexity`."
boundary = "MI suggests discussion; it does not mandate a refactor. CC thresholds are intentionally not recomputed here."

[[tools]]
id = "deptry"
languages = ["python"]  # 只对 Python 有效;未声明 python 的项目会显式跳过而不是静默通过
capability_id = "dependency-hygiene"
kind = "python-dev-tool"
package = "deptry"
purpose = "Dependency hygiene: unused, missing, and transitive dependency drift."
rule = ".ai-config/rules/engineering/code.index.md"
configured_in = ["pyproject.toml", "tools/check.py"]
entrypoint_commands = ["uv run deptry . --extend-exclude gates --per-rule-ignores DEP004=yaml|pathspec|pydantic|grimp {known_first_party_flags}"]
# 三个参数各自的理由:
#   --extend-exclude gates —— gates/ 装的是故意违规的反向样本(6 条 DEP003 全在那儿)。
#   DEP004 白名单 —— 闸自己的代码(tools/)本身就是 dev 工具,"发布代码不该 import dev 依赖"
#     这条判据对它不成立。刻意只列这几个模块名而不是整个排除 tools/:排除目录会让 tools/ 里
#     真正未声明的第三方 import 也没人查,而白名单漏了只会多报一条(可见),不会少报一族(静默)。
#   {known_first_party_flags} —— 从磁盘派生的第一方模块名,不在配置里枚举(78 条里 67 条假阳)。
stages = ["deep", "cleanup"]
scope = "Use for dependency debt triage."
boundary = "Dynamic imports, optional providers, and script-only dependencies need human review; yaml is a dev-only .ai-config tooling dependency."
relaxed = true
relaxed_reason = "模板工具模块通过 sys.path 复用同仓工具，deptry 会把这些本地工具导入报成依赖缺失；先作为 cleanup 债务体检，不阻塞迁移。"
