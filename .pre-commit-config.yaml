# 阶段 1 最小集：import-linter / detect-secrets / semgrep / 工具契约 / changed-file ruff / dependency approval / pip-audit(manual)
# 设计原则：
#   - detect-secrets 与项目依赖无关 → 用 pre-commit 隔离 env (repo: 模式)
#   - import-linter 必须能 import 到 src/<package> 类型 → 用 language: system 跑项目 .venv 里的工具
#   - semgrep / pip-audit 跑项目 .venv 里的固定 dev 依赖，避免 uvx 临时解析/缓存
#   - detect-secrets 版本钉死(rev); import-linter/semgrep/pip-audit 走项目 venv
#   - pip-audit 需要解析依赖漏洞库，默认放 manual 阶段；CI 中固定执行
#   - ruff 全量和格式仍是历史基线工具；默认只阻塞 staged Python 文件的新增 lint 问题，避免旧账阻塞提交
#   - basedpyright 当前是历史代码质量基线工具，先 manual，避免把已知红灯伪装成阻塞检查

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        stages: [manual]
      - id: ruff-format
        stages: [manual]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: |
          (?x)^(
            uv\.lock|
            \.ai-config/config/settings\.json|
            \.ai-config/template-state\.json|
            gates/.*
          )$
        # template-state.json 按构造就是一整份文件 SHA-256 清单,detect-secrets 一律判成
        # "Hex High Entropy String"。模板自己没有这个文件(它只在接管态项目里生成),
        # 所以这条漏了很久——框架的坑几乎都长这样:只在被接管的项目里炸。

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      # gates/ 装的是**故意违规**的反向样本和 append/ 片段:片段不是独立合法文档
      # (append/package.json 只是要追加进真文件的一段),样本也刻意带着格式问题。
      # 让通用格式化钩子改它们,等于把样本"修好"——闸就再也拦不住自己的样本了。
      # 实测:end-of-file-fixer 把 append/package.json 清空,提交当场中止。
      - id: check-json
        exclude: ^gates/
      - id: check-yaml
        exclude: ^gates/
      - id: check-toml
        exclude: ^gates/
      - id: end-of-file-fixer
        exclude: ^gates/
      - id: trailing-whitespace
        exclude: ^gates/

  - repo: local
    hooks:
      - id: python-compile
        name: python compile smoke check
        entry: uv run --no-project python tools/gate.py python-compile
        language: system
        pass_filenames: false
        types: [python]

      - id: basedpyright
        name: basedpyright (manual baseline)
        entry: uv run --no-project python tools/gate.py basedpyright
        language: system
        stages: [manual]
        types: [python]
        # 只检查正式区;支撑区与测试区后续阶段再纳入(此处不写死目录名,布局由 project_model 定)
        files: ^src/
        pass_filenames: false

      - id: ruff-staged
        name: ruff staged Python files
        entry: uv run --no-project python tools/gate.py ruff-staged
        language: system
        pass_filenames: false
        types: [python]

      - id: import-linter
        name: import-linter (分层契约)
        entry: uv run --no-project python tools/gate.py import-linter
        language: system
        pass_filenames: false
        # 任何 .py 改动都跑一遍(架构契约级,不该被跳)
        types: [python]

      - id: lifecycle
        name: lifecycle identity tag (非正式区身份标注)
        entry: uv run --no-project python tools/gate.py lifecycle-changed
        language: system
        pass_filenames: false
        # 只卡新增/改动的非正式区文件缺 # lifecycle: 身份标注;full sweep 在 CI 跑。
        types: [python]

      - id: rule-tool-contracts
        name: rule/tool contract check
        entry: uv run --no-project python tools/gate.py rule-tool-contracts
        language: system
        pass_filenames: false
        # 闸自己的目录 + 仓库根上的任何文件。根级那条(`[^/]+`)刻意不列扩展名:各语言的清单
        # 都住在根上(pyproject.toml / package.json / go.mod / vite.config.ts),列扩展名的写法
        # 每接一门新语言就漏一次——实测纯 TS 仓漏掉 package.json、vite.config.ts 等 5 个。
        # 宁可多跑(改根上的 README 会白跑 1.2s)也不能漏触发:漏了是静默不检查。
        # 精确判据仍只有一份,在 project_model.contracts.contract_files,check.py 直接读它;
        # 这里只需要是它的超集,rule-tool-contracts 会核对这层包含关系。
        files: ^(\.ai-config/.*|\.semgrep/.*|\.github/workflows/.*|tools/.*\.py|[^/]+)$

      - id: dependency-change-approval
        name: dependency/lock change approval gate
        entry: uv run --no-project python tools/gate.py dependency-change-approval
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|requirements.*\.txt|.*/requirements.*\.txt|requirements\.lock|.*/requirements\.lock|package\.json|package-lock\.json)$

      - id: semgrep
        name: semgrep (project static guardrails)
        entry: uv run --no-project python tools/gate.py semgrep
        language: system
        pass_filenames: false
        files: ^(.+\.py|\.semgrep/.+\.ya?ml)$

      - id: pip-audit
        name: pip-audit (dependency vulnerabilities)
        entry: uv run --no-project python tools/gate.py pip-audit
        language: system
        pass_filenames: false
        stages: [manual]
